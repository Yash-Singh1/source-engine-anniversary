name: Build

on: [push, pull_request]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-arm64:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Build macOS arm64 (hl2_complete)
      run: |
        scripts/build-macos-amd64.sh

  build-macos-x86_64:
    runs-on: macos-15-intel

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Build macOS x86_64 (hl2_complete)
      run: |
        scripts/build-macos-amd64.sh

  winline-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check bytematch #line directives
      run: |
        python3 devtools/bytematch/toolchain/win32/winline.py --check
